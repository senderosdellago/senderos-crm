    { key: "EN PROCESO", label: "En proceso", color: "--st-proceso", soft: "--st-proceso-soft" },
    { key: "PROGRAMADO", label: "Programado", color: "--st-programado", soft: "--st-programado-soft" },
    { key: "EN ESPERA", label: "En espera", color: "--st-espera", soft: "--st-espera-soft" },
    { key: "FINALIZADO", label: "Finalizado", color: "--st-finalizado", soft: "--st-finalizado-soft" }
  ];
  var PRIORIDADES = ["Alta", "Media", "Baja"];
  var STALE_DAYS = 14;

  var state = { areas: [], people: [], tasks: [], hitos: [], presupuestos: {}, nextNo: 1, nextHitoNo: 1 };
  if (!state.people) state.people = ["Ana", "Diana", "Santiago"];
  if (!state.hitos) state.hitos = [];
  if (!state.presupuestos) state.presupuestos = {};
  if (!state.nextHitoNo) state.nextHitoNo = 1;

  var ui = {
    tab: "dashboard",
    search: "",
    filterArea: "",
    filterEstado: "",
    filterDueno: "",
    filterVencidas: false,
    filterAltaPrioridad: false,
    filterRiesgo: false,
    expanded: {},
    modal: null,
    writable: true,
    capReady: false,
    busy: false,
    toast: null
  };

  var root = document.getElementById("root");
  var publishTimer = null;
  var toastTimer = null;

  // ---------- utils ----------
  function uid(prefix) { return (prefix || "t") + Math.random().toString(36).slice(2, 10); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function parseDate(iso) { if (!iso) return null; var p = iso.split("-"); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)); }
  function daysBetween(iso) { var d = parseDate(iso); if (!d) return null; var t = parseDate(todayISO()); return Math.round((t - d) / 86400000); }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = parseDate(iso);
    var meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return d.getDate() + " " + meses[d.getMonth()] + " " + d.getFullYear();
  }
  function fmtMoney(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
    var neg = n < 0; n = Math.abs(Math.round(n));
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-$" : "$") + s;
  }
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function estadoInfo(key) { for (var i = 0; i < ESTADOS.length; i++) if (ESTADOS[i].key === key) return ESTADOS[i]; return ESTADOS[0]; }
  function valorComprometido(t) { if (t.cantidad != null && t.valorUnitario != null && t.cantidad !== "" && t.valorUnitario !== "") return Number(t.cantidad) * Number(t.valorUnitario); return null; }
  function isVencida(t) { return t.fechaEntrega && t.estado !== "FINALIZADO" && parseDate(t.fechaEntrega) < parseDate(todayISO()); }
  function isStale(t) {
    if (t.estado === "FINALIZADO") return false;
    if (!t.ultimoSeguimiento) return true;
    var d = daysBetween(t.ultimoSeguimiento);
    return d !== null && d > STALE_DAYS;
  }
  function findTask(id) { for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }
  function findHito(id) { for (var i = 0; i < state.hitos.length; i++) if (state.hitos[i].id === id) return state.hitos[i]; return null; }
  function blockingTask(t) {
    if (!t.dependeDeId) return null;
    var dep = findTask(t.dependeDeId);
    if (dep && dep.estado !== "FINALIZADO") return dep;
    return null;
  }
  function hitoTasks(hitoId) { return state.tasks.filter(function (t) { return t.hitoId === hitoId; }); }
  function hitoProgress(h) {
    var ts = hitoTasks(h.id);
    var total = ts.length;
    var done = ts.filter(function (t) { return t.estado === "FINALIZADO"; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    var estado = total === 0 ? "sintareas" : (done === total ? "logrado" : (done === 0 ? "noiniciado" : "encurso"));
    return { total: total, done: done, pct: pct, estado: estado };
  }

  // ---------- computed stats ----------
  function computeStats() {
    var byEstado = {};
    ESTADOS.forEach(function (e) { byEstado[e.key] = 0; });
    var byAreaEstado = {};
    state.areas.forEach(function (a) { byAreaEstado[a] = {}; ESTADOS.forEach(function (e) { byAreaEstado[a][e.key] = 0; }); });
    var byPersona = {};
    var totalValor = 0;
    var vencidas = [];
    var stale = [];
    var riesgos = [];
    var budget = {};
    state.areas.forEach(function (a) { budget[a] = { presupuestado: state.presupuestos[a] || 0, comprometido: 0, ejecutado: 0 }; });

    state.tasks.forEach(function (t) {
      if (byEstado[t.estado] === undefined) byEstado[t.estado] = 0;
      byEstado[t.estado]++;
      if (!byAreaEstado[t.area]) { byAreaEstado[t.area] = {}; ESTADOS.forEach(function (e) { byAreaEstado[t.area][e.key] = 0; }); }
      if (byAreaEstado[t.area][t.estado] === undefined) byAreaEstado[t.area][t.estado] = 0;
      byAreaEstado[t.area][t.estado]++;
      var vc = valorComprometido(t);
      if (vc) totalValor += vc;
      if (!budget[t.area]) budget[t.area] = { presupuestado: state.presupuestos[t.area] || 0, comprometido: 0, ejecutado: 0 };
      if (vc) budget[t.area].comprometido += vc;
      if (t.valorEjecutado) budget[t.area].ejecutado += Number(t.valorEjecutado);

      var dueno = t.dueno;
      if (dueno && t.estado !== "FINALIZADO" && (t.estado === "PENDIENTE" || t.estado === "EN PROCESO")) {
        byPersona[dueno] = (byPersona[dueno] || 0) + 1;
      }
      if (isVencida(t)) vencidas.push(t);
      if (isStale(t)) stale.push(t);
      if (t.esRiesgo && t.estado !== "FINALIZADO") riesgos.push(t);
    });

    var activos = (byEstado["PENDIENTE"] || 0) + (byEstado["EN PROCESO"] || 0) + (byEstado["PROGRAMADO"] || 0) + (byEstado["EN ESPERA"] || 0);
    vencidas.sort(function (a, b) { return parseDate(a.fechaEntrega) - parseDate(b.fechaEntrega); });
    stale.sort(function (a, b) {
      var da = a.ultimoSeguimiento ? daysBetween(a.ultimoSeguimiento) : 9999;
      var db = b.ultimoSeguimiento ? daysBetween(b.ultimoSeguimiento) : 9999;
      return db - da;
    });

    var hitoCounts = { logrado: 0, encurso: 0, noiniciado: 0, sintareas: 0, enriesgo: 0 };
    state.hitos.forEach(function (h) {
      var p = hitoProgress(h);
      hitoCounts[p.estado]++;
      if (h.enRiesgo) hitoCounts.enriesgo++;
    });

    return { byEstado: byEstado, byAreaEstado: byAreaEstado, byPersona: byPersona, totalValor: totalValor, vencidas: vencidas, stale: stale, riesgos: riesgos, activos: activos, budget: budget, hitoCounts: hitoCounts };
  }

  // ---------- filtering ----------
  function duenosDisponibles() {
    var set = {};
    state.tasks.forEach(function (t) { if (t.dueno) set[t.dueno] = true; });
    return Object.keys(set).sort();
  }

  function visibleTasks() {
    var q = ui.search.trim().toLowerCase();
    return state.tasks.filter(function (t) {
      if (ui.filterArea && t.area !== ui.filterArea) return false;
      if (ui.filterEstado && t.estado !== ui.filterEstado) return false;
      if (ui.filterDueno && t.dueno !== ui.filterDueno) return false;
      if (ui.filterVencidas && !isVencida(t)) return false;
      if (ui.filterAltaPrioridad && t.prioridad !== "Alta") return false;
      if (ui.filterRiesgo && !t.esRiesgo) return false;
      if (q) {
        var hay = (t.actividad + " " + t.detalle + " " + t.area + " " + t.dueno + " " + (t.colaboradores || []).join(" ") + " " + (t.observacion || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // ---------- persistence ----------
  function scheduleSave(immediate) {
    if (publishTimer) { clearTimeout(publishTimer); publishTimer = null; }
    if (immediate) { doPublish(); return; }
    publishTimer = setTimeout(doPublish, 1200);
  }

  function doPublish() {
    publishTimer = null;
    if (!ui.writable) { render(); return; }
    ui.busy = true; render();
    state.updatedAt = new Date().toISOString();
    fetch("/api/brujula", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).then(function (r) {
      if (!r.ok) throw new Error("save failed: " + r.status);
      ui.busy = false;
      render();
    }).catch(function (err) {
      ui.busy = false;
      showToast("No se pudo guardar. Intenta de nuevo.");
      render();
    });
  }

  function showToast(msg) {
    ui.toast = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { ui.toast = null; render(); }, 3200);
    render();
  }

  function mutate(fn, opts) {
    fn();
    render();
    scheduleSave(opts && opts.immediate);
  }

  // ---------- rendering ----------
  function render() { root.innerHTML = renderRoot(); }

  function renderRoot() {
    var body = ui.tab === "dashboard" ? renderDashboard() : (ui.tab === "hitos" ? renderHitos() : renderSeguimiento());
    return (
      renderHeader() +
      '<main>' +
      (ui.writable ? "" : renderReadonlyBanner()) +
      body +
      '</main>' +
      (ui.modal ? renderModal() : "") +
      (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + '</div>' : "")
    );
  }

  function renderReadonlyBanner() {
    return '<div class="readonly-banner">Estás viendo esta página en modo de solo lectura: tus cambios no se guardarán para el equipo.</div>';
  }

  function renderHeader() {
    var dot = ui.busy ? "busy" : (ui.writable ? "" : "off");
    var syncLabel = ui.busy ? "Guardando…" : (ui.writable ? "Al día" : "Solo lectura");
    var addBtn = "";
    if (ui.writable) {
      if (ui.tab === "seguimiento") addBtn = '<button class="btn primary" data-action="open-add-task">+ Nueva tarea</button>';
      if (ui.tab === "hitos") addBtn = '<button class="btn primary" data-action="open-add-hito">+ Nuevo hito</button>';
    }
    return (
      '<header class="top">' +
        '<div class="brand"><span class="name">Senderos del Lago</span><span class="sub">SEGUIMIENTO DE COMPROMISOS</span></div>' +
        '<nav class="tabs" role="tablist">' +
          '<button role="tab" aria-selected="' + (ui.tab === "dashboard") + '" class="' + (ui.tab === "dashboard" ? "active" : "") + '" data-action="tab" data-tab="dashboard">Dashboard</button>' +
          '<button role="tab" aria-selected="' + (ui.tab === "hitos") + '" class="' + (ui.tab === "hitos" ? "active" : "") + '" data-action="tab" data-tab="hitos">Hitos</button>' +
          '<button role="tab" aria-selected="' + (ui.tab === "seguimiento") + '" class="' + (ui.tab === "seguimiento" ? "active" : "") + '" data-action="tab" data-tab="seguimiento">Seguimiento</button>' +
        '</nav>' +
        '<div class="header-spacer"></div>' +
        '<div class="sync-status"><span class="sync-dot ' + dot + '"></span>' + syncLabel + '</div>' +
        addBtn +
      '</header>'
    );
  }

  // ---- Dashboard ----
  function renderDashboard() {
    var s = computeStats();
    var tiles = [
      { label: "Pendientes", key: "PENDIENTE", value: s.byEstado["PENDIENTE"] || 0 },
      { label: "En proceso", key: "EN PROCESO", value: s.byEstado["EN PROCESO"] || 0 },
      { label: "Programados", key: "PROGRAMADO", value: s.byEstado["PROGRAMADO"] || 0 },
      { label: "En espera", key: "EN ESPERA", value: s.byEstado["EN ESPERA"] || 0 },
      { label: "Finalizados", key: "FINALIZADO", value: s.byEstado["FINALIZADO"] || 0 }
    ];
    var html = '<h1 class="section-title">Resumen general</h1><div class="stat-grid">';
    tiles.forEach(function (t) {
      var info = estadoInfo(t.key);
      html += '<div class="stat-tile"><div class="label"><span class="dot" style="background:var(' + info.color + ')"></span>' + t.label + '</div><div class="value">' + t.value + '</div></div>';
    });
    html += '<div class="stat-tile"><div class="label">Total activos</div><div class="value">' + s.activos + '</div></div>';
    html += '<div class="stat-tile"><div class="label">Vencidas</div><div class="value" style="color:var(--danger)">' + s.vencidas.length + '</div></div>';
    html += '<div class="stat-tile"><div class="label">Valor comprometido</div><div class="value small mono">' + fmtMoney(s.totalValor) + '</div></div>';
    html += '</div>';

    html += '<div class="dash-grid">';
    html += '<div class="card"><h2>Tareas por área</h2><div class="hint">Distribución de estados dentro de cada área</div>';
    state.areas.forEach(function (a) {
      var counts = s.byAreaEstado[a] || {};
      var total = ESTADOS.reduce(function (sum, e) { return sum + (counts[e.key] || 0); }, 0);
      if (!total) return;
      html += '<div class="area-row"><div class="area-head"><span>' + esc(a) + '</span><span class="n">' + total + '</span></div>';
      html += '<div class="stack-bar">';
      ESTADOS.forEach(function (e) {
        var c = counts[e.key] || 0;
        if (!c) return;
        var pct = (c / total * 100).toFixed(2);
        html += '<div class="stack-seg" style="width:' + pct + '%;background:var(' + e.color + ')" title="' + e.label + ': ' + c + '"></div>';
      });
      html += '</div></div>';
    });
    html += '<div class="legend">';
    ESTADOS.forEach(function (e) {
      html += '<span class="legend-item"><span class="dot" style="background:var(' + e.color + ')"></span>' + e.label + '</span>';
    });
    html += '</div></div>';

    var people = Object.keys(s.byPersona).sort(function (a, b) { return s.byPersona[b] - s.byPersona[a]; });
    var maxP = people.length ? s.byPersona[people[0]] : 1;
    html += '<div class="card"><h2>Pendientes por dueño</h2><div class="hint">Tareas propias en PENDIENTE o EN PROCESO</div>';
    if (!people.length) html += '<div class="empty-note">No hay tareas activas asignadas.</div>';
    people.forEach(function (p) {
      var w = Math.max(3, Math.round(s.byPersona[p] / maxP * 100));
      html += '<div class="person-row"><span class="pname" title="' + esc(p) + '">' + esc(p) + '</span><div class="hbar-track"><div class="hbar-fill" style="width:' + w + '%"></div></div><span class="pcount">' + s.byPersona[p] + '</span></div>';
    });
    html += '</div>';
    html += '</div>';

    html += '<div class="attn-grid">';
    html += '<div class="card"><h2>Vencidas</h2><div class="attn-list">';
    if (!s.vencidas.length) html += '<div class="empty-note">No hay tareas vencidas. ¡Al día!</div>';
    s.vencidas.slice(0, 8).forEach(function (t) {
      var d = daysBetween(t.fechaEntrega);
      html += '<div class="attn-item" data-action="open-edit-task" data-id="' + t.id + '"><span class="t">' + esc(t.actividad) + '</span><span class="badge">' + d + ' día' + (d === 1 ? "" : "s") + '</span><span class="meta">' + esc(t.area) + ' · ' + esc(t.dueno) + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="card"><h2>Sin actualizar hace +14 días</h2><div class="attn-list">';
    if (!s.stale.length) html += '<div class="empty-note">Todo el seguimiento está al día.</div>';
    s.stale.slice(0, 8).forEach(function (t) {
      var label = t.ultimoSeguimiento ? (daysBetween(t.ultimoSeguimiento) + " días") : "sin registrar";
      html += '<div class="attn-item" data-action="open-edit-task" data-id="' + t.id + '"><span class="t">' + esc(t.actividad) + '</span><span class="badge" style="color:var(--warm)">' + label + '</span><span class="meta">' + esc(t.area) + ' · ' + esc(t.dueno) + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="card"><h2>Riesgos y bloqueos</h2><div class="attn-list">';
    if (!s.riesgos.length) html += '<div class="empty-note">No hay tareas marcadas como riesgo o dependientes de terceros.</div>';
    s.riesgos.slice(0, 8).forEach(function (t) {
      html += '<div class="attn-item" data-action="open-edit-task" data-id="' + t.id + '"><span class="t">' + esc(t.actividad) + '</span><span class="badge" style="color:var(--danger)">⚠</span><span class="meta">' + esc(t.area) + ' · ' + esc(t.dueno) + '</span></div>';
    });
    html += '</div></div>';
    html += '</div>';

    html += '<div class="dash-grid">';
    html += '<div class="card"><h2>Hitos<button class="link-action" data-action="tab" data-tab="hitos">Ver todos →</button></h2>';
    var hc = s.hitoCounts;
    if (!state.hitos.length) {
      html += '<div class="empty-note">Aún no hay hitos definidos. Créalos en la pestaña Hitos para tener una vista ejecutiva del proyecto.</div>';
    } else {
      html += '<div class="stat-grid" style="margin-bottom:0">';
      html += '<div class="stat-tile"><div class="label">Logrados</div><div class="value small" style="color:var(--st-finalizado)">' + hc.logrado + '</div></div>';
      html += '<div class="stat-tile"><div class="label">En curso</div><div class="value small" style="color:var(--st-programado)">' + hc.encurso + '</div></div>';
      html += '<div class="stat-tile"><div class="label">No iniciados</div><div class="value small">' + hc.noiniciado + '</div></div>';
      html += '<div class="stat-tile"><div class="label">En riesgo</div><div class="value small" style="color:var(--danger)">' + hc.enriesgo + '</div></div>';
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="card"><h2>Presupuesto por frente<button class="link-action" data-action="open-presupuesto">Editar →</button></h2>';
    html += '<div class="table-wrap" style="box-shadow:none"><table class="budget-table"><thead><tr><th>Área</th><th style="text-align:right">Presupuestado</th><th style="text-align:right">Comprometido</th><th style="text-align:right">Ejecutado</th><th>Uso</th></tr></thead><tbody>';
    state.areas.forEach(function (a) {
      var b = s.budget[a] || { presupuestado: 0, comprometido: 0, ejecutado: 0 };
      var pct = b.presupuestado ? Math.round(b.ejecutado / b.presupuestado * 100) : null;
      html += '<tr><td>' + esc(a) + '</td><td class="num">' + (b.presupuestado ? fmtMoney(b.presupuestado) : "—") + '</td><td class="num">' + fmtMoney(b.comprometido) + '</td><td class="num">' + fmtMoney(b.ejecutado) + '</td>';
      html += '<td class="budget-bar-cell">' + (pct === null ? '<span class="empty-note" style="padding:0">sin definir</span>' : '<div class="budget-mini-track"><div class="budget-mini-fill' + (pct > 100 ? ' over' : '') + '" style="width:' + Math.min(pct, 100) + '%"></div></div>') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    html += '</div>';

    return html;
  }

  // ---- Hitos ----
  function renderHitos() {
    var html = '<div class="section-head"><div><h1 class="section-title">Hitos del proyecto</h1><p class="section-hint">La vista ejecutiva: qué hitos importan por frente y qué tan cerca están de lograrse.</p></div></div>';
    if (!state.hitos.length) {
      html += '<div class="hito-grid"><div class="empty-state"><h3>Todavía no hay hitos</h3><p>Un hito es un logro grande por frente — "Red eléctrica diseñada", "Subdivisión de zonas R y K radicada", "70 visitas/mes alcanzadas". Defínelos con tu equipo y vincula las tareas de Seguimiento a cada uno para ver el avance automáticamente.</p>' + (ui.writable ? '<button class="btn primary" data-action="open-add-hito" style="margin-top:10px">+ Crear el primer hito</button>' : '') + '</div></div>';
      return html;
    }
    html += '<div class="hito-grid">';
    state.hitos.forEach(function (h) {
      var p = hitoProgress(h);
      var badgeClass = p.estado;
      var badgeLabel = p.estado === "logrado" ? "Logrado" : p.estado === "encurso" ? "En curso" : p.estado === "noiniciado" ? "No iniciado" : "Sin tareas";
      html += '<div class="hito-card' + (h.enRiesgo ? ' en-riesgo' : '') + '">';
      if (ui.writable) {
        html += '<div class="hito-actions"><button class="icon-btn" title="Editar" data-action="open-edit-hito" data-id="' + h.id + '">' + iconEdit() + '</button></div>';
      }
      html += '<div class="hf-top"><h3>' + esc(h.nombre) + '</h3><div class="hito-area-tag">' + esc(h.area) + '</div></div>';
      if (h.descripcion) html += '<div class="hito-desc">' + esc(h.descripcion) + '</div>';
      html += '<div class="hito-progress-track"><div class="hito-progress-fill" style="width:' + p.pct + '%"></div></div>';
      html += '<div class="hito-meta"><span>' + p.done + ' de ' + p.total + ' tareas' + (p.total === 0 ? " vinculadas" : " completadas") + '</span><span class="hito-badge ' + badgeClass + '">' + badgeLabel + '</span></div>';
      if (h.fechaObjetivo) html += '<div class="hito-meta" style="margin-top:6px"><span>Meta: ' + fmtDate(h.fechaObjetivo) + '</span><span></span></div>';
      if (h.enRiesgo) html += '<div class="risk-ribbon">⚠ Marcado en riesgo</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---- Seguimiento (matrix) ----
  function renderSeguimiento() {
    var tasks = visibleTasks();
    var html = '<h1 class="section-title">Seguimiento actual</h1>';
    html += '<div class="toolbar">';
    html += '<div class="search-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
    html += '<input type="text" placeholder="Buscar actividad, dueño, área…" data-field="search" value="' + esc(ui.search) + '" /></div>';
    html += '<div class="filter-group">';
    html += '<select class="filter-select" data-field="filter-dueno"><option value="">Todos los dueños</option>' +
      duenosDisponibles().map(function (p) { return '<option value="' + esc(p) + '"' + (p === ui.filterDueno ? " selected" : "") + '>' + esc(p) + '</option>'; }).join("") + '</select>';
    html += '<select class="filter-select" data-field="filter-area"><option value="">Todas las áreas</option>' +
      state.areas.map(function (a) { return '<option value="' + esc(a) + '"' + (a === ui.filterArea ? " selected" : "") + '>' + esc(a) + '</option>'; }).join("") + '</select>';
    html += '<select class="filter-select" data-field="filter-estado"><option value="">Todos los estados</option>' +
      ESTADOS.map(function (e) { return '<option value="' + e.key + '"' + (e.key === ui.filterEstado ? " selected" : "") + '>' + e.label + '</option>'; }).join("") + '</select>';
    html += '</div>';
    html += '<div class="filter-group">';
    html += '<button class="chip-filter warn" aria-pressed="' + ui.filterVencidas + '" data-action="filter-vencidas">⏰ Vencidas</button>';
    html += '<button class="chip-filter warn" aria-pressed="' + ui.filterAltaPrioridad + '" data-action="filter-alta">⚑ Prioridad alta</button>';
    html += '<button class="chip-filter warn" aria-pressed="' + ui.filterRiesgo + '" data-action="filter-riesgo">⚠ Riesgos</button>';
    html += '</div>';
    if (ui.search || ui.filterAltaPrioridad || ui.filterRiesgo || ui.filterVencidas || ui.filterDueno || ui.filterArea || ui.filterEstado) {
      html += '<button class="btn ghost small" data-action="clear-filters">Limpiar filtros</button>';
    }
    html += '</div>';
    html += '<p class="field-note" style="margin:-10px 0 14px">"Vencidas" es por fecha de entrega (ya pasó y no está Finalizada) — es independiente del Estado; una tarea puede estar "En proceso" y vencida a la vez.</p>';

    html += '<div class="table-wrap"><table class="matrix"><thead><tr>' +
      '<th>No</th><th>Área / Actividad</th><th>Dueño</th><th>Entrega</th><th>Estado</th><th>Último seguimiento</th><th></th>' +
      '</tr></thead><tbody>';

    if (!tasks.length) {
      html += '<tr><td colspan="7" class="no-results">No hay tareas que coincidan con el filtro.</td></tr>';
    }

    tasks.forEach(function (t) {
      var vencida = isVencida(t);
      var stale = isStale(t);
      var blocker = blockingTask(t);
      var rowClasses = (vencida ? "vencida " : "") + (t.estado === "FINALIZADO" ? "finalizado " : "");
      html += '<tr class="' + rowClasses.trim() + '">';
      html += '<td class="td-no">' + t.no + '</td>';
      html += '<td class="td-actividad"><span class="actividad-title" data-action="toggle-row" data-id="' + t.id + '">' + esc(t.actividad) + '</span>';
      var flags = "";
      if (t.prioridad === "Alta") flags += '<span class="flag-icon fi-priority" title="Prioridad alta">' + iconFlag() + '</span>';
      if (t.esRiesgo) flags += '<span class="flag-icon fi-risk" title="Riesgo / depende de un tercero">' + iconWarn() + '</span>';
      if (blocker) flags += '<span class="flag-icon fi-blocked" title="Bloqueada por: ' + esc(blocker.actividad) + '">' + iconLink() + '</span>';
      if (flags) html += '<span class="flag-icons">' + flags + '</span>';
      html += '<span class="area-tag">' + esc(t.area) + '</span></td>';
      html += '<td>' + (t.dueno ? '<span class="tag-owner">' + esc(t.dueno) + '</span>' : '<span class="empty-note" style="padding:0">sin asignar</span>') + '</td>';
      html += '<td class="td-fecha-entrega">' + fmtDate(t.fechaEntrega) + '</td>';
      html += '<td>' + renderEstadoSelect(t) + '</td>';
      html += '<td>' + (stale ? '<span class="stale-flag">● </span>' : "") + fmtDate(t.ultimoSeguimiento) + '</td>';
      html += '<td class="row-actions">' +
        (ui.writable ? '<button class="icon-btn" title="Marcar revisado hoy" data-action="mark-followed" data-id="' + t.id + '">' + iconCheck() + '</button>' : "") +
        '<button class="icon-btn" title="Editar" data-action="open-edit-task" data-id="' + t.id + '">' + iconEdit() + '</button>' +
        '</td>';
      html += '</tr>';
      if (ui.expanded[t.id]) {
        html += '<tr class="detail-row"><td colspan="7"><div class="detail-grid">';
        html += '<div class="detail-field"><div class="k">Detalle</div><div class="v">' + (t.detalle ? esc(t.detalle) : '—') + '</div></div>';
        html += '<div class="detail-field"><div class="k">Colaboradores</div><div class="v">' + ((t.colaboradores && t.colaboradores.length) ? esc(t.colaboradores.join(", ")) : '—') + '</div></div>';
        html += '<div class="detail-field"><div class="k">Prioridad</div><div class="v">' + esc(t.prioridad || "Media") + '</div></div>';
        var hito = t.hitoId ? findHito(t.hitoId) : null;
        html += '<div class="detail-field"><div class="k">Hito vinculado</div><div class="v">' + (hito ? esc(hito.nombre) : '—') + '</div></div>';

        html += '<div class="detail-field"><div class="k">Depende de</div><div class="v">' + (dep ? (esc(dep.actividad) + ' (' + estadoInfo(dep.estado).label + ')') : '—') + '</div></div>';
        if (t.cantidad != null || t.valorUnitario != null || t.valorEjecutado != null) {
          html += '<div class="detail-field"><div class="k">Costo</div><div class="v mono">Comprometido ' + fmtMoney(valorComprometido(t)) + ' · Ejecutado ' + fmtMoney(t.valorEjecutado) + '</div></div>';
        }

          html += '<textarea class="obs-quick" data-field="quick-obs" data-id="' + t.id + '" placeholder="Escribe la próxima acción…">' + esc(t.observacion) + '</textarea>';
        } else {
          html += '<div class="v">' + (t.observacion ? esc(t.observacion) : '—') + '</div>';
        }
        html += '</div></div></td></tr>';
      }
    });

    html += '</tbody></table></div>';
    return html;
  }

  function renderEstadoSelect(t) {

    var fg = "var(" + info.color + ")";

  function iconX() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>'; }
  function iconFlag() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3v18h1.5v-7h11l-2.5-4 2.5-4h-12.5z"/></svg>'; }
  function iconWarn() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>'; }
  function iconLink() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>'; }

  // ---- Task modal ----

  function blankHitoDraft() {

    html += '<div class="field"><label>Colaboradores</label><div class="chip-input-box">';
    (d.colaboradores || []).forEach(function (p) {
      html += '<span class="resp-chip">' + esc(p) + '<button type="button" data-action="remove-colab" data-name="' + esc(p) + '">' + iconX() + '</button></span>';
    });
    html += '<input type="text" placeholder="Escribe un nombre y Enter…" data-field="colab-input" /></div>';
    var suggestions = (state.people || []).filter(function (p) { return (d.colaboradores || []).indexOf(p) === -1 && p !== d.dueno; });
    if (suggestions.length) {
      html += '<div class="suggest-row">' + suggestions.map(function (p) { return '<button type="button" class="suggest-chip" data-action="add-colab" data-name="' + esc(p) + '">+ ' + esc(p) + '</button>'; }).join("") + '</div>';

    html += '<div class="field"><label>Hito vinculado</label><select data-field="hitoId"><option value="">Sin hito</option>' + state.hitos.map(function (h) { return '<option value="' + h.id + '"' + (h.id === d.hitoId ? " selected" : "") + '>' + esc(h.nombre) + '</option>'; }).join("") + '</select></div>';
    html += '<div class="field"><label>Depende de</label><select data-field="dependeDeId"><option value="">Ninguna</option>' + state.tasks.filter(function (t) { return t.id !== d.id; }).map(function (t) { return '<option value="' + t.id + '"' + (t.id === d.dependeDeId ? " selected" : "") + '>' + t.no + '. ' + esc(t.actividad) + '</option>'; }).join("") + '</select></div>';
    html += '</div>';

    html += '<div class="field-row">';
    html += '<div class="field"><label>Fecha inicio</label><input type="date" data-field="fechaInicio" value="' + (d.fechaInicio || "") + '" /></div>';
    html += '<div class="field"><label>Fecha entrega</label><input type="date" data-field="fechaEntrega" value="' + (d.fechaEntrega || "") + '" /></div>';
    html += '</div>';

    html += '<div class="field"><label>Cantidad</label><input type="number" data-field="cantidad" value="' + (d.cantidad === "" || d.cantidad == null ? "" : d.cantidad) + '" /></div>';
    html += '<div class="field"><label>Valor unitario</label><input type="number" data-field="valorUnitario" value="' + (d.valorUnitario === "" || d.valorUnitario == null ? "" : d.valorUnitario) + '" /></div>';
    html += '<div class="field"><label>Comprometido</label><div class="valor-total-hint mono" style="padding-top:8px">' + fmtMoney(vc) + '</div></div>';
    html += '<div class="field"><label>Ejecutado</label><input type="number" data-field="valorEjecutado" value="' + (d.valorEjecutado === "" || d.valorEjecutado == null ? "" : d.valorEjecutado) + '" /></div>';
    html += '</div>';

    html += '<div class="field"><label>Último seguimiento</label><input type="date" data-field="ultimoSeguimiento" value="' + (d.ultimoSeguimiento || "") + '" /></div>';
    html += '<div class="field"><label>Observación / próxima acción</label><textarea data-field="observacion" placeholder="¿Qué sigue y quién responde?">' + esc(d.observacion) + '</textarea></div>';

    html += '<datalist id="people-list">' + (state.people || []).map(function (p) { return '<option value="' + esc(p) + '">'; }).join("") + '</datalist>';
    html += '</div>';

    html += '<div class="modal-foot">';
    if (isEdit) {
      if (m.confirmDelete) {
        html += '<div class="delete-confirm">¿Eliminar esta tarea? <button class="btn danger small" data-action="confirm-delete-task">Sí, eliminar</button><button class="btn ghost small" data-action="cancel-delete">Cancelar</button></div>';
      } else {
        html += '<button class="btn danger small" data-action="ask-delete-task">Eliminar</button>';

    } else { html += '<span></span>'; }
    html += '<div style="display:flex;gap:8px"><button class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="save-task">Guardar</button></div>';
    html += '</div>';

    html += '</div></div>';

  function renderHitoModal() {

    var html = '<div class="modal-overlay" data-action="overlay-close"><div class="modal" role="dialog" aria-modal="true">';
    html += '<div class="modal-head"><h2>' + (isEdit ? "Editar hito" : "Nuevo hito") + '</h2><button class="icon-btn" data-action="close-modal">' + iconX() + '</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field"><label>Nombre del hito</label><input type="text" data-field="h-nombre" value="' + esc(d.nombre) + '" placeholder="Ej. Red eléctrica diseñada y presupuestada" /></div>';
    html += '<div class="field-row">';
    html += '<div class="field"><label>Frente / área</label><select data-field="h-area">' + state.areas.map(function (a) { return '<option value="' + esc(a) + '"' + (a === d.area ? " selected" : "") + '>' + esc(a) + '</option>'; }).join("") + '</select></div>';
    html += '<div class="field"><label>Fecha objetivo</label><input type="date" data-field="h-fecha" value="' + (d.fechaObjetivo || "") + '" /></div>';

    html += '<div class="field"><label>Descripción</label><textarea data-field="h-desc" placeholder="Qué significa lograr este hito">' + esc(d.descripcion) + '</textarea></div>';

    html += '<div class="field-note">El avance se calcula solo, según cuántas tareas de Seguimiento vincules a este hito (campo "Hito vinculado" en cada tarea).</div>';
    html += '</div>';
    html += '<div class="modal-foot">';

      if (m.confirmDelete) {
        html += '<div class="delete-confirm">¿Eliminar este hito? <button class="btn danger small" data-action="confirm-delete-hito">Sí, eliminar</button><button class="btn ghost small" data-action="cancel-delete">Cancelar</button></div>';
      } else {
        html += '<button class="btn danger small" data-action="ask-delete-hito">Eliminar</button>';

  function renderPresupuestoModal() {
    var m = ui.modal;
    var d = m.draft;
    var html = '<div class="modal-overlay" data-action="overlay-close"><div class="modal" role="dialog" aria-modal="true">';
    html += '<div class="modal-head"><h2>Presupuesto por frente</h2><button class="icon-btn" data-action="close-modal">' + iconX() + '</button></div>';
    html += '<div class="modal-body">';
    html += '<div class="field-note" style="margin-bottom:4px">Define cuánto tienes presupuestado para cada área. El sistema compara esto contra lo comprometido y lo ejecutado automáticamente.</div>';

      html += '<div class="field"><label>' + esc(a) + '</label><input type="number" data-field="pres-' + esc(a) + '" value="' + (d[a] || "") + '" placeholder="0" /></div>';
    });

    html += '<div class="modal-foot"><span></span><div style="display:flex;gap:8px"><button class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="save-presupuesto">Guardar</button></div></div>';
    html += '</div></div>';

  // ---------- event wiring (delegated) ----------
  function onClick(ev) {
    var el = ev.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "tab") { ui.tab = el.getAttribute("data-tab"); render(); return; }
    if (action === "clear-filters") { ui.search = ""; ui.filterArea = ""; ui.filterEstado = ""; ui.filterDueno = ""; ui.filterVencidas = false; ui.filterAltaPrioridad = false; ui.filterRiesgo = false; render(); return; }
    if (action === "filter-vencidas") { ui.filterVencidas = !ui.filterVencidas; render(); return; }
    if (action === "filter-alta") { ui.filterAltaPrioridad = !ui.filterAltaPrioridad; render(); return; }
    if (action === "filter-riesgo") { ui.filterRiesgo = !ui.filterRiesgo; render(); return; }
    if (action === "toggle-row") { var id = el.getAttribute("data-id"); ui.expanded[id] = !ui.expanded[id]; render(); return; }

    if (action === "open-add-task") { ui.modal = { mode: "add", draft: blankTaskDraft(), confirmDelete: false }; render(); return; }
    if (action === "open-edit-task") {
      var task = findTask(el.getAttribute("data-id"));
      if (!task) return;
      var draft = JSON.parse(JSON.stringify(task));
      if (draft.hitoId === null || draft.hitoId === undefined) draft.hitoId = "";
      if (draft.dependeDeId === null || draft.dependeDeId === undefined) draft.dependeDeId = "";
      ui.modal = { mode: "edit", draft: draft, confirmDelete: false };
      render(); return;
    }
    if (action === "close-modal" || (action === "overlay-close" && ev.target === el)) { ui.modal = null; render(); return; }
    if (action === "add-area") {
      var input = document.querySelector('[data-field="new-area"]');
      var val = input && input.value.trim();
      if (val && state.areas.indexOf(val) === -1) { state.areas.push(val); ui.modal.draft.area = val; }
      if (input) input.value = "";
      render(); return;
    }
    if (action === "add-colab") {
      var name = el.getAttribute("data-name");
      if (ui.modal.draft.colaboradores.indexOf(name) === -1) ui.modal.draft.colaboradores.push(name);
      render(); return;
    }
    if (action === "remove-colab") {
      var rn = el.getAttribute("data-name");
      ui.modal.draft.colaboradores = ui.modal.draft.colaboradores.filter(function (p) { return p !== rn; });
      render(); return;
    }
    if (action === "ask-delete-task") { ui.modal.confirmDelete = true; render(); return; }
    if (action === "ask-delete-hito") { ui.modal.confirmDelete = true; render(); return; }
    if (action === "cancel-delete") { ui.modal.confirmDelete = false; render(); return; }
    if (action === "confirm-delete-task") {
      var delId = ui.modal.draft.id;
      ui.modal = null;
      mutate(function () { state.tasks = state.tasks.filter(function (t) { return t.id !== delId; }); }, { immediate: true });
      return;
    }
    if (action === "confirm-delete-hito") {
      var delHitoId = ui.modal.draft.id;
      ui.modal = null;
      mutate(function () {
        state.hitos = state.hitos.filter(function (h) { return h.id !== delHitoId; });
        state.tasks.forEach(function (t) { if (t.hitoId === delHitoId) t.hitoId = null; });
      }, { immediate: true });
      return;
    }
    if (action === "save-task") { saveTaskModal(); return; }
    if (action === "save-hito") { saveHitoModal(); return; }
    if (action === "save-presupuesto") { savePresupuestoModal(); return; }
    if (action === "mark-followed") {
      var mid = el.getAttribute("data-id");
      mutate(function () {
        var t = findTask(mid);
        if (t) t.ultimoSeguimiento = todayISO();
      }, { immediate: true });
      return;
    }
    if (action === "open-add-hito") { ui.modal = { mode: "hito-add", draft: blankHitoDraft(), confirmDelete: false }; render(); return; }
    if (action === "open-edit-hito") {
      var hito = findHito(el.getAttribute("data-id"));
      if (!hito) return;
      ui.modal = { mode: "hito-edit", draft: JSON.parse(JSON.stringify(hito)), confirmDelete: false };
      render(); return;
    }
    if (action === "open-presupuesto") {
      var pd = {};
      state.areas.forEach(function (a) { pd[a] = state.presupuestos[a] || ""; });
      ui.modal = { mode: "presupuesto", draft: pd, confirmDelete: false };
      render(); return;
    }
  }

  function saveTaskModal() {
    var d = ui.modal.draft;
    if (!d.actividad || !d.actividad.trim()) { showToast("Escribe una actividad antes de guardar."); return; }
    var isEdit = ui.modal.mode === "edit";
    ui.modal = null;
    mutate(function () {
      var payload = {
        area: d.area, actividad: d.actividad.trim(), detalle: d.detalle || "",
        cantidad: d.cantidad === "" ? null : Number(d.cantidad),
        valorUnitario: d.valorUnitario === "" ? null : Number(d.valorUnitario),
        valorEjecutado: d.valorEjecutado === "" ? null : Number(d.valorEjecutado),
        fechaInicio: d.fechaInicio || null, fechaEntrega: d.fechaEntrega || null,
        dueno: (d.dueno || "").trim(), colaboradores: d.colaboradores || [],
        prioridad: d.prioridad || "Media", esRiesgo: !!d.esRiesgo,
        hitoId: d.hitoId || null, dependeDeId: d.dependeDeId || null,
        estado: d.estado, ultimoSeguimiento: d.ultimoSeguimiento || null, observacion: d.observacion || ""
      };
      if (isEdit) {
        var t = findTask(d.id);
        if (t) { for (var k in payload) t[k] = payload[k]; }
      } else {
        var no = state.nextNo || (state.tasks.length + 1);
        payload.id = uid("t"); payload.no = no;
        if (!payload.fechaInicio) payload.fechaInicio = todayISO();
        state.tasks.push(payload);
        state.nextNo = no + 1;
      }
    }, { immediate: true });
  }

  function saveHitoModal() {
    var d = ui.modal.draft;
    var nombre = (document.querySelector('[data-field="h-nombre"]') || {}).value || d.nombre;
    if (!nombre || !nombre.trim()) { showToast("Escribe un nombre para el hito."); return; }
    var isEdit = ui.modal.mode === "hito-edit";
    ui.modal = null;
    mutate(function () {
      var payload = { nombre: nombre.trim(), area: d.area, descripcion: d.descripcion || "", fechaObjetivo: d.fechaObjetivo || null, enRiesgo: !!d.enRiesgo };
      if (isEdit) {
        var h = findHito(d.id);
        if (h) { for (var k in payload) h[k] = payload[k]; }
      } else {
        payload.id = uid("h"); payload.no = state.nextHitoNo || 1;
        state.hitos.push(payload);
        state.nextHitoNo = (state.nextHitoNo || 1) + 1;
      }
    }, { immediate: true });
  }

  function savePresupuestoModal() {
    var d = ui.modal.draft;
    ui.modal = null;
    mutate(function () {
      state.areas.forEach(function (a) {
        var v = d[a];
        state.presupuestos[a] = (v === "" || v == null) ? 0 : Number(v);
      });
    }, { immediate: true });
  }

  function onInput(ev) {
    var el = ev.target;
    var field = el.getAttribute && el.getAttribute("data-field");
    if (!field) return;
    if (field === "search") { ui.search = el.value; render(); refocus(el); return; }
    if (field === "quick-obs") {
      var id = el.getAttribute("data-id");
      var t = findTask(id);
      if (t) { t.observacion = el.value; scheduleSave(false); }
      return;
    }
    if (ui.modal && ui.modal.mode === "presupuesto") {
      if (field.indexOf("pres-") === 0) { ui.modal.draft[field.slice(5)] = el.value; return; }
    }
    if (ui.modal && (ui.modal.mode === "hito-add" || ui.modal.mode === "hito-edit")) {
      var hd = ui.modal.draft;
      if (field === "h-nombre") hd.nombre = el.value;
      else if (field === "h-desc") hd.descripcion = el.value;
      else if (field === "h-fecha") hd.fechaObjetivo = el.value;
      return;
    }
    if (ui.modal && (ui.modal.mode === "add" || ui.modal.mode === "edit")) {
      var d = ui.modal.draft;
      if (field === "actividad") d.actividad = el.value;
      else if (field === "detalle") d.detalle = el.value;
      else if (field === "dueno") { d.dueno = el.value; render(); refocus(el); return; }
      else if (field === "cantidad") d.cantidad = el.value;
      else if (field === "valorUnitario") d.valorUnitario = el.value;
      else if (field === "valorEjecutado") d.valorEjecutado = el.value;
      else if (field === "fechaInicio") d.fechaInicio = el.value;
      else if (field === "fechaEntrega") d.fechaEntrega = el.value;
      else if (field === "ultimoSeguimiento") d.ultimoSeguimiento = el.value;
      else if (field === "observacion") d.observacion = el.value;
      else if (field === "colab-input") { return; }
      if (field === "cantidad" || field === "valorUnitario" || field === "valorEjecutado") { render(); refocus(el); }
    }
  }

  function refocus(el) {
    var sel = el.getAttribute("data-field");
    var idAttr = el.getAttribute("data-id");
    setTimeout(function () {
      var q = idAttr ? '[data-field="' + sel + '"][data-id="' + idAttr + '"]' : '[data-field="' + sel + '"]';
      var target = document.querySelector(q);
      if (target) { target.focus(); if (target.value) { try { target.setSelectionRange(target.value.length, target.value.length); } catch (e) {} } }
    }, 0);
  }

  function onKeydown(ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute("data-field") === "colab-input" && ev.key === "Enter") {
      ev.preventDefault();
      var val = el.value.trim();
      if (val && ui.modal.draft.colaboradores.indexOf(val) === -1) { ui.modal.draft.colaboradores.push(val); }
      el.value = "";
      render();
      var again = document.querySelector('[data-field="colab-input"]');
      if (again) again.focus();
    }
    if (ev.key === "Escape" && ui.modal) { ui.modal = null; render(); }
  }

  function onChange(ev) {
    var el = ev.target;
    var action = el.getAttribute && el.getAttribute("data-action");
    var field = el.getAttribute && el.getAttribute("data-field");
    if (action === "set-estado") {
      var id = el.getAttribute("data-id");
      mutate(function () {
        var t = findTask(id);
        if (t) t.estado = el.value;
      }, { immediate: true });
      return;
    }
    if (field === "filter-dueno") { ui.filterDueno = el.value; render(); return; }
    if (field === "filter-area") { ui.filterArea = el.value; render(); return; }
    if (field === "filter-estado") { ui.filterEstado = el.value; render(); return; }
    if (ui.modal && (ui.modal.mode === "hito-add" || ui.modal.mode === "hito-edit")) {
      var hd = ui.modal.draft;
      if (field === "h-area") hd.area = el.value;
      else if (field === "h-riesgo") hd.enRiesgo = el.checked;
      render(); return;
    }
    if (ui.modal && (ui.modal.mode === "add" || ui.modal.mode === "edit") && field) {
      var d = ui.modal.draft;
      if (field === "area") d.area = el.value;
      else if (field === "estado") d.estado = el.value;
      else if (field === "prioridad") d.prioridad = el.value;
      else if (field === "hitoId") d.hitoId = el.value;
      else if (field === "dependeDeId") d.dependeDeId = el.value;
      else if (field === "esRiesgo") d.esRiesgo = el.checked;
      render();
    }
  }

  root.addEventListener("click", onClick);
  root.addEventListener("input", onInput);
  root.addEventListener("change", onChange);
  root.addEventListener("keydown", onKeydown);

  render();

  fetch("/api/brujula")
    .then(function (r) {
      if (!r.ok) throw new Error("load failed: " + r.status);
      return r.json();
    })
    .then(function (data) {
      if (data && Array.isArray(data.tasks)) {
        state = data;
        if (!state.people) state.people = [];
        if (!state.hitos) state.hitos = [];
        if (!state.presupuestos) state.presupuestos = {};
        if (!state.nextHitoNo) state.nextHitoNo = 1;
        if (!state.nextNo) state.nextNo = 1;
      }
      ui.writable = true;
      ui.capReady = true;
      render();
    })
    .catch(function () {
      ui.writable = false;
      render();
    });
}
App();
</script>
